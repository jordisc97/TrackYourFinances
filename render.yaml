services:
  - type: web
    name: track-your-finances
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/finances.db
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MIN_PASSWORD_LENGTH
        value: "8"
      - key: BANK_PROVIDER
        value: gocardless
      - key: BANK_COUNTRY
        value: ES
      - key: DEEPSEEK_API
        sync: false
